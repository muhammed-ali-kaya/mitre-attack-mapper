    - 4728
    - 4732
    - 4756
    - 4738
  min_events: 1
  confidence: high
  note: Ayricalikli gruba uye ekleme ya da hesap ozelliklerinin degistirilmesi.
- technique_id: T1505.003
  tactic: TA0003
  name: Web Shell
  required:
    event_ids:
    - 11
    - 4663
  field_conditions:
  - any_of:
    - field: file.name
      must_match: (?i)\\(inetpub\\wwwroot|wwwroot|htdocs)\\
    - field: file.path
      must_match: (?i)\\(inetpub\\wwwroot|wwwroot|htdocs)\\
    - field: process.command_line
      must_match: (?i)\\(inetpub\\wwwroot|wwwroot|htdocs)\\
  - field: file.name
    must_match: (?i)\.(aspx?|jsp|php)\b
  min_events: 1
  confidence: high
- technique_id: T1055
  tactic: TA0004
  name: Process Injection
  required:
    event_ids:
    - 8
    - 10
  field_conditions:
  - field: process.name
    must_not_match: (?i)(?:^|\\)(MsMpEng|CSFalconService|SentinelAgent|xagt)\.exe
  min_events: 1
  confidence: medium
  note: Sysmon 8 (CreateRemoteThread) ve 10 (ProcessAccess) enjeksiyonun temel telemetrisi; EDR urunleri de ayni
    olaylari uretir, o yuzden disariniyorlar.
- technique_id: T1055.001
  tactic: TA0004
  name: Dynamic-link Library Injection
  required:
    event_ids:
    - 8
    - 7
  field_conditions:
  - field: file.name
    must_match: (?i)\.dll\b
  - any_of:
    - field: file.name
      must_match: (?i)(\\users\\|\\temp\\|\\programdata\\|\\appdata\\)
    - field: file.path
      must_match: (?i)(\\users\\|\\temp\\|\\programdata\\|\\appdata\\)
    - field: process.command_line
      must_match: (?i)(\\users\\|\\temp\\|\\programdata\\|\\appdata\\)
  min_events: 1
  confidence: high
  note: Kullanicinin yazabildigi bir dizinden DLL yuklenmesi.
- technique_id: T1055.012
  tactic: TA0004
  name: Process Hollowing
  required:
    event_ids:
    - 8
  field_conditions:
  - field: Message
    must_match: (?i)(NtUnmapViewOfSection|SetThreadContext|WriteProcessMemory)
    tasinmadi: KANITSIZ
    not: 'hedef alan semada yok, gercek log ornegi bekleniyor (aday: api.call)'
  min_events: 1
  confidence: high
- technique_id: T1003.002
  tactic: TA0006
  name: Security Account Manager
  required:
    event_ids:
    - 4688
    - 4656
    - 4663
    - 1
  field_conditions:
  - any_of:
    - field: process.command_line
      must_match: reg\s+save\s+hklm\\sam
    - field: object.name
      must_match: (\\config\\SAM\b|HKLM\\SAM)
    - field: process.command_line
      must_match: (\\config\\SAM\b|HKLM\\SAM)
  min_events: 1
  confidence: high
- technique_id: T1110.001
  tactic: TA0006
  name: Password Guessing
  required:
    event_ids:
    - 4625
  min_events: 5
  confidence: medium
  note: Tek bir basarisiz oturum acma normaldir. min_events=5 ile ancak tekrarlayan basarisizlik kaba kuvvet sayilir.
- technique_id: T1558.003
  tactic: TA0006
  name: Kerberoasting
  required:
    event_ids:
    - 4769
  field_conditions:
  - field: Message
    must_match: (?i)(0x17|rc4[-_ ]?hmac)
    tasinmadi: KANITSIZ
    not: 'hedef alan semada yok, gercek log ornegi bekleniyor (aday: ticket.encryption_type)'
  min_events: 1
  confidence: high
  note: RC4 sifreleme talebi (etype 0x17) kerberoasting'in klasik izidir.
- technique_id: T1550.002
  tactic: TA0008
  name: Pass the Hash
  required:
    event_ids:
    - 4624
  field_conditions:
  - field: logon.type
    must_match: (?i)logon type:\s*3
  - field: Message
    must_match: (?i)(NtLmSsp|NTLM)
    tasinmadi: KANITSIZ
    not: 'hedef alan semada yok, gercek log ornegi bekleniyor (aday: auth.package)'
  min_events: 1
  confidence: medium
- technique_id: T1021.001
