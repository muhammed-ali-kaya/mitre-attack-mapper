techniques:
- technique_id: T1686.003
  tactic: TA0112
  name: Windows Host Firewall
  required:
    event_ids:
    - 4946
    - 4947
    - 4948
    - 4949
    - 4950
    - 4954
    - 5025
  forbidden:
    event_ids:
    - 5156
    - 5158
  field_conditions:
  - field: Message
    must_match: (?i)(rule (was )?(added|deleted|modified|changed)|setting.{0,30}changed|exception list|was restored
      to the default|service.{0,20}stopped)
    tasinmadi: S
    not: olay anlambilimi -- config/event_semantics.yaml'a tasinacak
  min_events: 1
  confidence: high
  note: Yalnızca güvenlik duvarı YAPILANDIRMASININ değiştiği olaylardan tetiklenir. Trafik denetim kayıtları (5156/5158)
    kanıt değildir.
- technique_id: T1685.001
  tactic: TA0112
  name: Disable or Modify Windows Event Log
  required:
    event_ids:
    - 4719
  field_conditions:
  - field: Message
    must_match: (?i)audit polic(y|ies).{0,40}changed
    tasinmadi: S
    not: olay anlambilimi -- config/event_semantics.yaml'a tasinacak
  min_events: 1
  confidence: high
  note: 'K1a: emekli T1562.002''den tasindi. 1102 (denetim gunlugu TEMIZLENDI) ve "audit log was cleared" kolu
    CIKARILDI -- o olay ailesi T1685.005''e (Clear Windows Event Logs) aittir; bu kural yalnizca denetim
    politikasinin degistirilmesini kapsar.'
- technique_id: T1685.001
  tactic: TA0112
  name: Disable or Modify Windows Event Log
  required:
    event_ids:
    - 7040
  field_conditions:
  - field: Message
    must_match: (?i)Windows Event Log service was changed from .{0,30} to disabled
    tasinmadi: S
    not: olay anlambilimi -- config/event_semantics.yaml'a tasinacak
  min_events: 1
  confidence: high
  note: 'K1a'' (D4 c): 7040 herhangi bir hizmetin baslangic turu degisikligidir; YALNIZCA Windows Event Log
    hizmetinin devre disi birakilmasi bu teknigin kanitidir. Baska hizmet ya da devre disi olmayan gecis eslesmez.'
- technique_id: T1685
  tactic: TA0112
  name: Disable or Modify Tools
  required:
    event_ids:
    - 5001
    - 5010
    - 5012
    - 5101
  field_conditions:
  - field: Message
    must_match: (?i)(disabled|turned off|stopped)
    tasinmadi: S
    not: olay anlambilimi -- config/event_semantics.yaml'a tasinacak
  min_events: 1
  confidence: high
  note: Microsoft Defender'ın gerçek zamanlı korumasının kapatıldığı olaylar.
- technique_id: T1059.001
  tactic: TA0002
  name: PowerShell
  required:
    event_ids:
    - 4104
  field_conditions:
  - any_of:
    - field: script.block_text
      must_match: (?i)(scriptblock|script block)
    - field: event.message
      must_match: (?i)(scriptblock|script block)
  min_events: 1
  confidence: high
  note: Yalnızca 4104 (script block logging) kanıt sayılır — betiğin İÇERİĞİ görülebilir. 400/403/600 yalnızca motorun
    başlayıp durduğunu söyler, ne çalıştırıldığını söylemez; bunlar teknik üretmez.
- technique_id: T1059.003
  tactic: TA0002
  name: Windows Command Shell
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - field: process.name
    must_match: (?i)(?:^|\\)cmd\.exe
  min_events: 1
  confidence: high
- technique_id: T1053.005
  tactic: TA0002
  name: Scheduled Task
  required:
    event_ids:
    - 4698
    - 4699
    - 4700
    - 4702
  min_events: 1
  confidence: high
- technique_id: T1053.005
  tactic: TA0002
  name: Scheduled Task
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - field: process.name
    must_match: (?i)schtasks(\.exe)?\b
  - field: process.command_line
    must_match: (?i)/(create|change)\b
  min_events: 1
  confidence: high
  note: schtasks.exe'nin yalnizca CALISMASI yeterli degil; /create ya da /change argumani sart. "schtasks /query"
    envanter komutudur, gorev olusturmaz.
- technique_id: T1059.001
  tactic: TA0002
  name: PowerShell
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - field: process.name
    must_match: (?i)powershell(\.exe)?\b
  - field: process.command_line
    must_match: (?i)(-enc\b|-encodedcommand|downloadstring|downloadfile|\biex\b|invoke-expression|-executionpolicy\s+bypass|-w(indowstyle)?\s+hidden)
  min_events: 1
  confidence: high
  note: PowerShell'in calismasi tek basina kanit DEGILDIR -- kurumsal ortamda gunde binlerce kez mesru calisir.
    Yalnizca kodun gizlendigini/indirildigini gosteren argumanlarla birlikte teknik uretilir.
- technique_id: T1543.003
  tactic: TA0003
  name: Windows Service
  required:
    event_ids:
    - 7045
    - 4697
  min_events: 1
  confidence: high
- technique_id: T1003.001
  tactic: TA0006
  name: LSASS Memory
  required:
    event_ids:
    - 4656
    - 4663
    - 10
  field_conditions:
  - any_of:
    - field: target.image
      must_match: (?i)lsass\.exe
    - field: object.name
      must_match: (?i)lsass\.exe
  min_events: 1
  confidence: high
  note: 4656/4663 tek başına yeterli DEĞİL — bu olaylar rutin registry/dosya erişiminde de üretilir. Nesnenin lsass.exe
    olması şart.
- technique_id: T1021.002
  tactic: TA0008
  name: SMB/Windows Admin Shares
  required:
    event_ids:
    - 5140
    - 5145
  field_conditions:
  - field: share.name
    must_match: (?i)(ADMIN\$|C\$|IPC\$)
