    event_ids:
    - 1102
    - 104
    - 4688
    - 1
  field_conditions:
  - any_of:
    - field: Message
      must_match: (audit log was cleared|log file was cleared)
    - field: process.command_line
      must_match: (wevtutil\s+cl\b|clear-eventlog)
  min_events: 1
