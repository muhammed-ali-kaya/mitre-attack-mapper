  confidence: high
- technique_id: T1105
  tactic: TA0011
  name: Ingress Tool Transfer
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - any_of:
    - field: process.name
      must_match: (curl\.exe|wget\.exe)
    - field: process.command_line
      must_match: (certutil.*-urlcache|bitsadmin.*/transfer|invoke-webrequest|downloadfile)
  min_events: 1
  confidence: high
- technique_id: T1071.001
  tactic: TA0011
  name: Web Protocols
  required:
    event_ids:
    - 3
    - 5156
  field_conditions:
  - field: destination.port
    must_match: (?i)destination port:\s*(80|443|8080|8443)\b
  - any_of:
    - field: file.name
      must_match: (?i)\\(users|programdata|temp|appdata)\\
    - field: file.path
      must_match: (?i)\\(users|programdata|temp|appdata)\\
    - field: process.command_line
      must_match: (?i)\\(users|programdata|temp|appdata)\\
  min_events: 1
  confidence: medium
  note: Standart web portuna baglanti tek basina kanit DEGILDIR -- her tarayici bunu yapar. Ancak baglantiyi kuran
    ikili kullanicinin yazabildigi bir dizindeyse anlamli hale gelir.
- technique_id: T1071.004
  tactic: TA0011
  name: DNS
  required:
    event_ids:
    - 22
  field_conditions:
  - field: Message
    must_match: (?i)query name:\s*\S{40,}
    tasinmadi: KANITSIZ
    not: 'hedef alan semada yok, gercek log ornegi bekleniyor (aday: dns.question.name)'
  min_events: 1
  confidence: medium
  note: Alisilmadik uzunlukta DNS sorgusu -- DNS tunelleme izi.
- technique_id: T1560
  tactic: TA0009
  name: Archive Collected Data
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - field: process.name
    must_match: (?i)(?:^|\\)(rar|7z|7za|winrar|tar)\.exe
  - field: process.command_line
    must_match: (?i)(\s-hp|\s-p\S|\sa\s+-|compress-archive)
  min_events: 1
  confidence: high
  note: Parola korumali ya da acik arsivleme komutu -- yalnizca arac adi yeterli degil.
- technique_id: T1074
  tactic: TA0009
  name: Data Staged
  required:
    event_ids:
    - 11
    - 4663
  field_conditions:
  - any_of:
    - field: file.name
      must_match: (?i)\\(users\\public|programdata|windows\\temp)\\
    - field: file.path
      must_match: (?i)\\(users\\public|programdata|windows\\temp)\\
    - field: process.command_line
      must_match: (?i)\\(users\\public|programdata|windows\\temp)\\
    - field: object.name
      must_match: (?i)\\(users\\public|programdata|windows\\temp)\\
  - any_of:
    - field: file.name
      must_match: (?i)\.(zip|rar|7z|cab|tar|gz)\b
    - field: object.name
      must_match: (?i)\.(zip|rar|7z|cab|tar|gz)\b
  min_events: 1
  confidence: medium
  note: 'K1d (D3): 4663 eklendi AMA object.name koluyla birlikte -- 4663''un anlamli alanlarinda file.name yok
    (config/event_semantics.yaml); kolsuz eklenen olay hic saglanamayacak bir kosul uretirdi.'
- technique_id: T1490
  tactic: TA0040
  name: Inhibit System Recovery
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - field: process.command_line
    must_match: (?i)(vssadmin.*delete\s+shadows|wbadmin.*delete|bcdedit.*recoveryenabled\s+no|bcdedit.*bootstatuspolicy\s+ignoreallfailures)
  min_events: 1
  confidence: high
- technique_id: T1486
  tactic: TA0040
  name: Data Encrypted for Impact
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - any_of:
    - field: process.command_line
      must_match: (cipher\s+/w|bcdedit.*safeboot)
    - field: file.name
      must_match: \.(locked|encrypted|crypt)\b
  min_events: 1
  confidence: medium
- technique_id: T1489
  tactic: TA0040
  name: Service Stop
  required:
    event_ids:
    - 4688
    - 7040
    - 1
  field_conditions:
  - field: process.command_line
    must_match: (?i)(net\s+stop\s|sc\s+(stop|config).*disabled|stop-service)
  min_events: 1
  confidence: medium
- technique_id: T1686
  tactic: TA0112
  name: Disable or Modify System Firewall
  required:
    event_ids:
    - 4688
    - 1
