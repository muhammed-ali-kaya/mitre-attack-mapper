- technique_id: T1070.003
  tactic: TA0112
  name: Clear Command History
  required:
    event_ids:
    - 4688
    - 4104
    - 1
  field_conditions:
  - field: process.command_line
    must_match: (?i)(clear-history|remove-item.*consolehost_history|set-psreadlineoption\s+-historysavestyle\s+savenothing)
  min_events: 1
  confidence: high
- technique_id: T1564.003
  tactic: TA0005
  name: Hidden Window
  required:
    event_ids:
    - 4688
    - 4104
    - 400
    - 1
  field_conditions:
  - field: process.command_line
    must_match: (?i)-w(indowstyle)?\s+hidden
  min_events: 1
  confidence: medium
- technique_id: T1140
