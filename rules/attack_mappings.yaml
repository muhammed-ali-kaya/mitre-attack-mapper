- technique_id: T1082
  tactic: TA0007
  name: System Information Discovery
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - field: process.name
    must_match: (?i)(?:^|\\)(systeminfo|hostname|wmic)\.exe
  min_events: 1
  confidence: medium
- technique_id: T1083
  tactic: TA0007
  name: File and Directory Discovery
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - any_of:
    - field: process.name
      must_match: (tree\.com|where\.exe)
    - field: process.command_line
      must_match: (dir /s|get-childitem -recurse)
  min_events: 1
  confidence: medium
- technique_id: T1047
  tactic: TA0002
  name: Windows Management Instrumentation
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - field: process.name
    must_match: (?i)(?:^|\\)(wmic|wmiprvse)\.exe
  - field: process.command_line
    must_match: (?i)(process\s+call\s+create|/node:|node=)
  min_events: 1
  confidence: high
  note: wmic.exe'nin calismasi tek basina kanit degil; envanter sorgusu da wmic kullanir. Uzak dugum (/node:) ya
    da process call create sart.
- technique_id: T1218.010
  tactic: TA0005
  name: Regsvr32
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - field: process.name
    must_match: (?i)(?:^|\\)regsvr32\.exe
  - field: process.command_line
    must_match: (?i)(/i:|scrobj\.dll|https?://|\\\\)
  min_events: 1
  confidence: high
  note: Squiblydoo deseni -- uzak scriptlet ya da scrobj.dll ile proxy calistirma.
- technique_id: T1218.011
  tactic: TA0005
  name: Rundll32
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - field: process.name
    must_match: (?i)(?:^|\\)rundll32\.exe
  - field: process.command_line
    must_match: (?i)(javascript:|\.dll\s*,\s*\w+|url\.dll|shell32\.dll\s*,\s*shellexec)
  min_events: 1
  confidence: high
- technique_id: T1204.002
  tactic: TA0002
  name: Malicious File
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - field: parent.process.name
    must_match: (?i)(winword|excel|powerpnt|outlook)\.exe
  - field: process.name
    must_match: (?i)(?:^|\\)(cmd|powershell|wscript|cscript|mshta|regsvr32|rundll32)\.exe
  min_events: 1
  confidence: high
  note: Office uygulamasinin komut yorumlayicisi baslatmasi. Ana surec-alt surec iliskisi tek satirda gorunmuyorsa
    bu kural tetiklenmez.
- technique_id: T1566.001
  tactic: TA0001
  name: Spearphishing Attachment
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - field: parent.process.name
    must_match: (?i)outlook\.exe
  - field: process.name
    must_match: (?i)(?:^|\\)(cmd|powershell|wscript|cscript|mshta)\.exe
  min_events: 1
  confidence: medium
- technique_id: T1547.001
  tactic: TA0003
  name: Registry Run Keys / Startup Folder
  required:
    event_ids:
    - 4657
    - 12
    - 13
    - 11
  field_conditions:
  - any_of:
    - field: object.name
      must_match: (?i)(\\CurrentVersion\\Run|\\CurrentVersion\\RunOnce|\\Start Menu\\Programs\\Startup)
    - field: file.name
      must_match: (?i)(\\CurrentVersion\\Run|\\CurrentVersion\\RunOnce|\\Start Menu\\Programs\\Startup)
  min_events: 1
  confidence: high
  note: 'K1d: desen Baslangic klasoru varyantini zaten taniyordu ama olay listesi ve alan yalnizca registry''di.
    Baslangic klasorune dosya birakmak bir DOSYA OLUSTURMA olayidir (Sysmon 11, TargetFilename -> file.name).'
- technique_id: T1543.003
  tactic: TA0003
  name: Windows Service
  required:
    event_ids:
    - 4657
    - 13
  field_conditions:
  - field: object.name
    must_match: (?i)\\Services\\[^\\]+\\ImagePath
  min_events: 1
  confidence: high
  note: 'K1a (D1): hizmetin ImagePath degerinin registry uzerinden degistirilmesi -- T1543.003''un IKINCI kurali
    (ilki 7045/4697 hizmet kurulumu). Eskiden T1543.001 altindaydi; 19.2''de T1543.001 = Launch Agent (macOS).'
- technique_id: T1136.001
  tactic: TA0003
  name: Local Account
  required:
    event_ids:
    - 4720
  min_events: 1
  confidence: high
