    - 4688
    - 1
  field_conditions:
  - field: process.command_line
    must_match: (?i)certutil.*-decode
  min_events: 1
  confidence: high
- technique_id: T1620
  tactic: TA0005
  name: Reflective Code Loading
  required:
    event_ids:
    - 4104
  field_conditions:
  - field: script.block_text
    must_match: (?i)(\[reflection\.assembly\]::load|system\.reflection\.assembly)
