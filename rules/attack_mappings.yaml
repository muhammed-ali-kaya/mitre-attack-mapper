- technique_id: T1057
  tactic: TA0007
  name: Process Discovery
  required:
    event_ids:
    - 4688
    - 1
  field_conditions:
  - any_of:
    - field: process.name
      must_match: (tasklist\.exe|qprocess\.exe)
    - field: process.command_line
