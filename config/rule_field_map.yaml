  sira: 1
- teknik: T1059.001
  desen: (?i)powershell(\.exe)?\b
  sinif: T
  hedef: process.name
  atesleme_60: 1
  olay_id_veride_var: true
  gerekce: 'Tek süreç adı; `.exe` isteğe bağlı olduğundan alan hem ''powershell'' hem ''powershell.exe''
