  desen: (?i)(-enc\b|-encodedcommand|downloadstring|downloadfile|\biex\b|invoke-expression|-executionpolicy\s+bypass|-w(indowstyle)?\s+hidden)
  sinif: T
  hedef: process.command_line
  atesleme_60: 1
  olay_id_veride_var: true
  gerekce: Bayrak ve cmdlet listesi; hepsi komut satırı. 4104 olayında alternatifi script.block_text --
    motor iki alanı da denemeli.
  sira: 1
- teknik: T1003.001
  desen: (?i)lsass\.exe
  sinif: T
  hedef:
  - target.image
  - object.name
  atesleme_60: 0
  olay_id_veride_var: false
  gerekce: 'DİKKAT -- process.name DEĞİL. Sysmon EventID 10''da lsass.exe ERİŞİLEN süreçtir (TargetImage);
    erişen süreç saldırganınkidir. process.name''e taşımak tekniği tersine çevirir. Kaldırılan QUERY_ENRICHMENT''ın
    lsass anahtarı da tam bu ayrımı yapamadığı için bastırıcıya ihtiyaç duymuştu. DUZELTME (olculdu 2026-08-18):
    kural HEM Sysmon 10 HEM 4656 istiyor ve lsass.exe bu iki olayda FARKLI ALANDA duruyor: Sysmon 10''da
    TargetImage, 4656''da Object Name. Yalnizca target.image''e tasimak 4656 vakasini oldurdu. process.name
    HALA yasak -- o ERISEN sureçtir ve tekniği tersine cevirir. Ayni ders ucuncu kez: alan secimi TEKNIGE
    degil OLAYA baglidir.'
  sira: 0
