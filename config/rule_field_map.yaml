# Kural kosullari -> yapisal alan haritasi (2B'nin ilk teslimi)
#
# NE ISE YARAR: rules/attack_mappings.yaml'daki 57 kosulun TAMAMI bugun
# `field: Message` diyor -- yani ham log metnini regex'liyor. Bu tablo her
# kosulun HANGI kanonik alana ait oldugunu soyler. Kural motoru bu tabloyu
# okuyan genel bir eslestirici olacak; tablo buyudugunde KOD DEGISMEYECEK.
#
# KOLONLARIN KAYNAGI AYRI:
#   desen / sira        ALINTI  -- kaynak dosyadan URETILIR, elle yazilmaz.
#                       Elle kopyalandiginda bes desen yanlis/eksik cikti
#                       (savenothing kirpilmis, bootstatuspolicy kirpilmis,
#                       (?i) oneki dusmus). Test bunu yakaladi.
#   sinif/hedef/gerekce HUKUM   -- insan karari. Bir sezgisel siniflandirici
#                       denendi ve `(disabled|turned off|stopped)` gibi anlati
#                       desenlerini komut satirina atadi; kullanilmadi.
#   atesleme_60         OLCUM   -- 60 senaryoda kac kez atesledi
#   olay_id_veride_var  OLCUM   -- gerekli olay ID'si veri setinde var mi
#
# SINIFLAR
#   T        tek bir kanonik alana tasinir
#   KARMA    desen IKI farkli seyi ariyor -> iki kosula BOLUNMELI (`bolme`)
#   S        alan degeri degil OLAYIN ANLAMI -> config/event_semantics.yaml
#   KANITSIZ hedef alan semada yok VE gercek yazimini gosteren log ornegi yok
#            -> tahminle sema buyutulmez; hedef: null, aday ad ayri kolonda
#
# UYARI -- ATESLEME SIFIRSA TASIMA TEST EDILEMEZ
# 49 kuralin yalnizca 14'u atesleniyor; 57 satirin 39'u sifir. Sebep buyuk
# olcude VERI SETINDE: 60 senaryonun 45'inde hic EventID yok (duzyazi
# girdiler) ve veride toplam 6 farkli olay ID geciyor (4688 x10, 4720, 4732,
# 3, 11, 1102). Yani bu "35 kural OLU" demek DEGIL, "bu set 35 kurali
# SINAYAMIYOR" demek. Kabul kriterinde ayri sayilir.
# Ayrinti: docs/beklenti_2b_kural_kosullari.md

version: 1
kosullar:
- teknik: T1686.003
  desen: (?i)(rule (was )?(added|deleted|modified|changed)|setting.{0,30}changed|exception list|was restored
    to the default|service.{0,20}stopped)
  sinif: S
  hedef: event_semantics
  gerekce: '"kural eklendi/silindi" bir alan değeri değil, olayın anlamı. 4946-4954 olay ID''lerinin TAMAMI
    zaten "güvenlik duvarı yapılandırması değişti" demek. Desen, olay ID''sinin zaten söylediğini metinden
    tekrar okumaya çalışıyor -- ve 5156/5158 forbidden listesi işi zaten yapıyor.'
  atesleme_60: 0
  olay_id_veride_var: false
  sira: 0
- teknik: T1686
  desen: (?i)(rule (was )?(added|deleted|modified|changed)|setting.{0,30}changed|exception list|was restored
    to the default|service.{0,20}stopped)
  sinif: S
  hedef: event_semantics
  gerekce: 'K1a'' -- T1686.003 kuralinin olay kumesi (4946-4950, 4954, 5025) ve desenin birebir kopyasi; ust
    teknik alt teknigiyle ayni kanitla onaylanir. Sinif ve gerekce T1686.003 satiriyla ayni: aranan sey olayin
    anlami, alan degeri degil.'
  atesleme_60: 0
  olay_id_veride_var: false
  sira: 0
- teknik: T1685.001
  desen: (?i)Windows Event Log service was changed from .{0,30} to disabled
  sinif: S
  hedef: event_semantics
  gerekce: 'K1a'' -- 7040 herhangi bir hizmetin baslangic turu degisikligi; desen olayi Windows Event Log
    hizmetinin DEVRE DISI birakilmasina daraltir. Aranan sey olayin anlami (hangi hizmet, hangi yone), alan
    degeri degil.'
  atesleme_60: 0
  olay_id_veride_var: false
  sira: 0
- teknik: T1685.001
  desen: (?i)audit polic(y|ies).{0,40}changed
  sinif: S
  hedef: event_semantics
  gerekce: 4719 = "denetim politikası değişti". Olay ID'si tek başına yeterli; desen aynı bilgiyi İngilizce
    mesaj metninden çıkarmaya çalışıyor, yani Türkçe/yerelleştirilmiş Windows'ta sessizce başarısız olur.
    K1a -- emekli T1562.002'den taşındı; 1102 ("audit log was cleared") kolu çıkarıldı, o olay T1685.005'e
    (Clear Windows Event Logs) aittir.
  atesleme_60: 1
  olay_id_veride_var: true
  sira: 0
- teknik: T1685
  desen: (?i)(disabled|turned off|stopped)
  sinif: S
  hedef: event_semantics
  gerekce: 'Kataloğun en kırılgan koşulu: üç genel İngilizce kelime. "stopped" zararsız bir servis durdurmada
    da geçer. Yerelleştirilmiş logda hiç eşleşmez. Aranan şey "bir koruma kapatıldı" anlamı -- event_semantics''in
    işlem sınıfı alanına ait.'
  atesleme_60: 0
  olay_id_veride_var: false
  sira: 0
- teknik: T1003.002
  desen: (?i)(reg\s+save\s+hklm\\sam|\\config\\SAM\b|HKLM\\SAM)
  sinif: KARMA
  hedef:
  - process.command_line
  - object.name
  bolme:
  - alan: process.command_line
    desen: reg\s+save\s+hklm\\sam
  - alan: object.name
    desen: (\\config\\SAM\b|HKLM\\SAM)
  - alan: process.command_line
    desen: (\\config\\SAM\b|HKLM\\SAM)
  gerekce: 'BAYRAK VAKA (known_regression). "reg save hklm\\sam" bir KOMUT; "\\config\\SAM" ve "HKLM\\SAM"
    bir NESNE YOLU. İkisi tek desende. object.name yarısı ayrıca YOL NORMALİZASYONU istiyor: log "\\REGISTRY\\MACHINE\\SAM"
    yazıyor, desen "HKLM\\SAM" arıyor. path_normalizer.py yazıldı ve bekliyor -- bağlanacağı yer burası.
    DUZELTME (olculdu, rawlog-010): SAM YOLU olay turune gore FARKLI ALANDA yasiyor. 4656 registry erisiminde
    object.name, 4688 surec olusturmada KOMUT SATIRI ("reg.exe save HKLM\\SAM ..."). Yol ilk tasimada
    yalnizca object.name''e verildi ve rawlog-010 kayboldu; ucuncu kol o yuzden var. Ders: ayni kanit
    dizesi olay turune gore baska alanda bulunur -- alan secimi tekniğe degil OLAYA baglidir. "reg\s+save"
    kolu ayrica OLU: gercek loglar "reg.exe save" yaziyor, desen "reg save" ariyor. K1''e (kural kalitesi)
    girdi, 2B''de duzeltilmiyor.'
  atesleme_60: 1
  olay_id_veride_var: true
  sira: 0
- teknik: T1057
  desen: (?i)(\\tasklist\.exe|get-process|\\qprocess\.exe)
  sinif: KARMA
  hedef:
  - process.name
  - process.command_line
  bolme:
  - alan: process.name
    desen: (tasklist\.exe|qprocess\.exe)
  - alan: process.command_line
    desen: get-process
  gerekce: tasklist.exe ve qprocess.exe süreç ADI; get-process bir PowerShell cmdlet'i, yani süreç adı
    powershell.exe olur ve cmdlet komut satırında geçer. Aynı desende aranmaları, process.name'e taşındığında
    get-process kolunun sessizce ölmesine yol açar.
  atesleme_60: 0
  olay_id_veride_var: true
  sira: 0
- teknik: T1083
  desen: (?i)(\\tree\.com|dir /s|get-childitem -recurse|\\where\.exe)
  sinif: KARMA
  hedef:
  - process.name
  - process.command_line
  bolme:
  - alan: process.name
    desen: (tree\.com|where\.exe)
  - alan: process.command_line
    desen: (dir /s|get-childitem -recurse)
  gerekce: 'T1057 ile aynı desen: iki ikili adı + iki kabuk komutu. "dir /s" cmd.exe''nin komut satırında
    geçer, süreç adı "dir" diye bir şey yok.'
  atesleme_60: 0
  olay_id_veride_var: true
  sira: 0
- teknik: T1685.005
  desen: (?i)(audit log was cleared|log file was cleared|wevtutil\s+cl\b|clear-eventlog)
  sinif: KARMA
  hedef:
  - Message
  - process.command_line
  bolme:
  - alan: Message
    desen: (audit log was cleared|log file was cleared)
    tasinmadi: S
  - alan: process.command_line
    desen: (wevtutil\s+cl\b|clear-eventlog)
  gerekce: 'İlk iki kol ANLATI (1102 olayının anlamı), son ikisi KOMUT. Aynı teknik iki farklı kanıt türüyle
    görülebiliyor: ya olay günlüğü "temizlendim" der, ya da temizleyen komut yakalanır. İkisi ayrı koşul
    olmalı, biri diğerini maskelememeli. DUZELTME (olculdu, rawlog-009): anlati kolu ilk tasimada "event_semantics"
    alanina verildi -- ama o bir SATIR ALANI DEGIL, ayri bir tablo. Satirda oyle bir anahtar olmadigi
    icin kol SESSIZCE hic eslesmeyecekti. Sessiz basarisizlik yasak: kol event_semantics BAGLANANA KADAR
    Message''da kalir ve "tasinmadi: S" ile isaretlidir. Bir test artik kurallarda gecen her alan adinin
    satir sozlugunde GERCEKTEN var oldugunu dogruluyor.'
  atesleme_60: 1
  olay_id_veride_var: true
  sira: 0
- teknik: T1105
  desen: (?i)(certutil.*-urlcache|bitsadmin.*/transfer|\\curl\.exe|invoke-webrequest|downloadfile|\\wget\.exe)
  sinif: KARMA
  hedef:
  - process.name
  - process.command_line
  bolme:
  - alan: process.name
    desen: (curl\.exe|wget\.exe)
  - alan: process.command_line
    desen: (certutil.*-urlcache|bitsadmin.*/transfer|invoke-webrequest|downloadfile)
  gerekce: 'curl.exe/wget.exe adı tek başına yeterli kanıt; certutil ve bitsadmin ise MEŞRU ikililer --
    onları kanıt yapan şey BAYRAKLARI (-urlcache, /transfer). Bunları tek desende tutmak "certutil çalıştı"
    ile "certutil indirdi" arasındaki farkı siliyor. Ö1''de ölçülen boşluk da tam burası: hiçbir kol `-urlcache`
    -> indirme bağlantısını kuramıyor.'
  atesleme_60: 1
  olay_id_veride_var: true
  sira: 0
- teknik: T1486
  desen: (?i)(cipher\s+/w|\\bcdedit\.exe.*safeboot|\.(locked|encrypted|crypt)\b)
  sinif: KARMA
  hedef:
  - process.command_line
  - file.name
  bolme:
  - alan: process.command_line
    desen: (cipher\s+/w|bcdedit.*safeboot)
  - alan: file.name
    desen: \.(locked|encrypted|crypt)\b
  gerekce: İki komut deseni + bir DOSYA UZANTISI. Fidye yazılımının bıraktığı ".locked" uzantısı komut
    satırında değil dosya adında görünür; şu an Message düz metni sayesinde tesadüfen eşleşiyor.
  atesleme_60: 0
  olay_id_veride_var: true
  sira: 0
- teknik: T1071.004
  desen: (?i)query name:\s*\S{40,}
  sinif: KANITSIZ
  hedef: null
  onerilen_alan_adayi: dns.question.name
  gerekce: '"Query Name" hiçbir test verisinde geçmiyor; 60 senaryodaki tek DNS geçişi subtech-010''da
    Türkçe düzyazı ("DNS sorgularını kullandı"). Sysmon EventID 22 örneği gelmeden alan adı yazılmaz.'
  atesleme_60: 0
  olay_id_veride_var: false
  sira: 0
- teknik: T1550.002
  desen: (?i)(NtLmSsp|NTLM)
  sinif: KANITSIZ
  hedef: null
  onerilen_alan_adayi: auth.package
  gerekce: NtLmSsp / AuthenticationPackageName hiçbir test verisinde yok; 4624 örneği de yok. Alan adı
    Windows'ta AuthenticationPackageName, LmPackageName ve ECS'te winlog.event_data.* olarak geçiyor --
    hangisi olduğu örnekle belirlenir, tahminle değil.
  atesleme_60: 0
  olay_id_veride_var: false
  sira: 1
- teknik: T1558.003
  desen: (?i)(0x17|rc4[-_ ]?hmac)
  sinif: KANITSIZ
  hedef: null
  onerilen_alan_adayi: ticket.encryption_type
  gerekce: 'Kerberos olay ID''leri (4768/4769/4776) hiçbir test verisinde yok. "0x17" ayrıca TEHLİKELİ
    genel bir dize: normalize edilmemiş bir handle ya da maske değeri de "0x17" olabilir. Yapısal alana
    taşımak bu yanlış eşleşmeyi kapatır -- ama önce alanın gerçek adı gerekiyor.'
  atesleme_60: 0
  olay_id_veride_var: false
  sira: 0
- teknik: T1055.012
  desen: (?i)(NtUnmapViewOfSection|SetThreadContext|WriteProcessMemory)
  sinif: KANITSIZ
  hedef: null
  onerilen_alan_adayi: api.call
  gerekce: Bunlar API ÇAĞRISI adları. Hiçbir Windows/Sysmon olayı bu adları yapısal bir alanda vermiyor
    -- EDR telemetrisi gerekir. Şemada karşılığı yok ve örnek de yok; kanıt gelene kadar bırakılır.
  atesleme_60: 0
  olay_id_veride_var: false
  sira: 0
- teknik: T1059.001
  desen: (?i)(scriptblock|script block)
  sinif: T
  hedef:
  - script.block_text
  - event.message
  atesleme_60: 1
  olay_id_veride_var: true
  gerekce: '4104 olayının script bloğu zaten ayrı bir alan; koşul o alanın VARLIĞINI arıyor, içeriğini
    değil. DUZELTME (olculdu 2026-08-18): 4104 olayinin script blogu iki bicimde gelebiliyor -- yapisal
    ScriptBlockText alani, ya da ''Creating Scriptblock text (1 of 1): ...'' diye mesaj govdesinde. Yalnizca
    script.block_text''e tasimak ikinci bicimi oldurdu. Ikisi de AYNI olayin kendi alanlari, baska bir
    surecin alani degil -- ters cevirme riski yok. AYRICA: kosul zaten required_event_ids=[4104] ile buyuk
    olcude gereksiz; yerellestirilmis Windows''ta ''Creating Scriptblock text'' cevrilir ve kosul sessizce
    olur. K1''e (kural kalitesi) girdi.'
  sira: 0
- teknik: T1059.003
  desen: (?i)(?:^|\\)cmd\.exe
  sinif: T
  hedef: process.name
  atesleme_60: 0
  olay_id_veride_var: true
  gerekce: Tek sureç adı. Message'da aranınca cmd.exe'nin BAŞKA bir alanda geçtiği her log da eşleşiyor
    -- örneğin ebeveyn süreç ya da erişilen görüntü olarak. process.name'e taşımak 'cmd.exe ÇALIŞTI' ile
    'logda cmd.exe GEÇİYOR' arasındaki farkı geri getirir.
  sira: 0
- teknik: T1053.005
  desen: (?i)schtasks(\.exe)?\b
  sinif: T
  hedef: process.name
  atesleme_60: 2
  olay_id_veride_var: true
  gerekce: Düz süreç adı; `.exe` isteğe bağlı olduğu için process.name hem 'schtasks' hem 'schtasks.exe'
